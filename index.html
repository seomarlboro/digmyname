<!doctype html>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "DigMyName",
        "alternateName": "Dig My Name",
        "url": "https://digmyname.com/",
        "description": "Smart domain search across 50+ TLDs with instant availability checks and registrar price comparison.",
        "inLanguage": "en",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://digmyname.com/?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "applicationCategory": "BusinessApplication",

  <body style="margin:0;background:#0a0b10;">

    <script type="module" src="/src/main.tsx"></script>
